<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14182a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icon/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="회귀 1996">
<title>회귀자의 선택 1996</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --outer:#d9d4c9;--bg:#f4f1ea;--surface:#ffffff;--surface2:#f8f5ef;--line:#e6dfd2;--ink:#1d2230;--muted:#6c7280;
  --accent:#2b59c3;--accent-soft:#e6ecfa;--gold:#b7790f;--gem:#7c4dff;--gem-soft:#efe9ff;--good:#1f9d55;--warn:#c77d0a;--bad:#d64545;--love:#e0527e;
  --up:#e5484d;--down:#2f6fed;--shadow:0 1px 2px rgba(30,25,15,.06),0 6px 18px rgba(30,25,15,.08);--scrim:rgba(12,14,22,.55);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --outer:#07090d;--bg:#10131a;--surface:#181c25;--surface2:#1f2430;--line:#2b313d;--ink:#e8ebf1;--muted:#9aa3b2;
  --accent:#7b97ff;--accent-soft:#1f2a4a;--gold:#f0b43c;--gem:#a78bfa;--gem-soft:#2a2342;--good:#3ccf7e;--warn:#f0a63c;--bad:#ff6b6b;--love:#ff7aa2;
  --up:#ff6369;--down:#5b8cff;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.65);
}}
:root[data-theme="dark"]{
  --outer:#07090d;--bg:#10131a;--surface:#181c25;--surface2:#1f2430;--line:#2b313d;--ink:#e8ebf1;--muted:#9aa3b2;
  --accent:#7b97ff;--accent-soft:#1f2a4a;--gold:#f0b43c;--gem:#a78bfa;--gem-soft:#2a2342;--good:#3ccf7e;--warn:#f0a63c;--bad:#ff6b6b;--love:#ff7aa2;
  --up:#ff6369;--down:#5b8cff;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--scrim:rgba(0,0,0,.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--outer);color:var(--ink);font-family:"Noto Sans KR",system-ui,"Malgun Gothic",sans-serif;font-size:14px;line-height:1.45;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:disabled{cursor:not-allowed;opacity:.45}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input{font:inherit;color:var(--ink)}
.num{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.up{color:var(--up)}.down{color:var(--down)}.muted{color:var(--muted)}.good{color:var(--good)}.bad{color:var(--bad)}.gemc{color:var(--gem)}
.ic{display:block;flex:none}

/* ---- 화면 틀: 세로 9:16 ---- */
.frame{position:fixed;inset:0;display:flex;justify-content:center}
.phone{position:relative;width:min(100vw,calc(100dvh * 9 / 16));height:100dvh;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 0 40px rgba(0,0,0,.18)}

/* ---- 상단 고정 스탯바 ---- */
.topbar{flex:none;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(6px + env(safe-area-inset-top)) 10px 6px;display:grid;gap:5px;z-index:5}
.tb1{display:grid;grid-template-columns:1fr 1fr 1fr auto auto;gap:6px;align-items:center}
.tb2{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center}
.st{min-width:0;line-height:1.15}
.st small{display:block;font-size:10px;color:var(--muted);font-weight:500;white-space:nowrap}
.st b{display:block;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gem-pill{display:flex;align-items:center;gap:3px;background:var(--gem-soft);color:var(--gem);border-radius:999px;padding:4px 9px 4px 7px;font-weight:700;font-size:13px}
.icon-btn{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);color:var(--ink)}
.icon-btn:active{transform:scale(.94)}
.chip-date{font-weight:700;font-size:13px;white-space:nowrap}
.chip-age{font-size:12px;color:var(--muted);white-space:nowrap}
.sta{display:flex;align-items:center;gap:6px;min-width:0}
.sta .bar{flex:1;height:8px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.sta .bar i{display:block;height:100%;background:linear-gradient(90deg,#f0b43c,#3ccf7e);border-radius:4px;transition:width .3s}
.sta .bar i.low{background:var(--bad)}
.sta span{font-size:11px;white-space:nowrap}

/* ---- 본문 ---- */
.view{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pad{padding:12px 12px 16px;display:grid;gap:12px;align-content:start;grid-auto-rows:max-content}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 8px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:6px}
.card h3 .r{margin-left:auto;font-weight:500}
.big{font-size:24px;font-weight:900;line-height:1.15;letter-spacing:-.02em}
.sub{font-size:12px;color:var(--muted)}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.sp{flex:1}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;font-size:13px}
.kv b{font-weight:500;color:var(--muted)}.kv span{text-align:right}
.kv.cost b{white-space:nowrap}

/* ---- 하단 메뉴 ---- */
.tabbar{flex:none;display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom));z-index:5}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 4px;border-radius:10px;color:var(--muted);font-size:11px;font-weight:700}
.tabbar button.on{color:var(--accent)}
.tabbar button.on .ic{transform:translateY(-1px)}
.tabbar .next{flex-direction:row;justify-content:center;gap:2px;margin:3px 0 3px 4px;border-radius:14px;background:var(--accent);color:#fff;padding:4px 4px 4px 10px;box-shadow:var(--shadow)}
.tabbar .next span{display:grid;line-height:1.15;text-align:left}
.tabbar .next b{font-size:14px;font-weight:900;white-space:nowrap}
.tabbar .next small{font-size:10px;font-weight:500;opacity:.85}
.tabbar .next.confirm{background:var(--warn)}
.tabbar .next:active:not(:disabled){transform:scale(.96)}

/* ---- 메인 ---- */
.main{height:100%;display:flex;flex-direction:column}
.hero{position:relative;flex:1 1 50%;min-height:200px;overflow:hidden;background:var(--surface2)}
.hero .room{position:absolute;inset:0;width:100%;height:100%}
.hero-fig{position:absolute;left:50%;bottom:0;height:88%;aspect-ratio:200/260;transform:translateX(-50%);animation:breathe 4s ease-in-out infinite}
.hero-fig svg{width:100%;height:100%;display:block}
.hero-img{position:absolute;top:5%;left:50%;height:150%;transform:translateX(-50%);user-select:none;pointer-events:none}
@keyframes breathe{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-1.5%)}}
@media (prefers-reduced-motion:reduce){.hero-fig{animation:none}}
.hero-tag{position:absolute;left:10px;top:10px;background:rgba(20,24,34,.62);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;backdrop-filter:blur(4px)}
.recall-btn{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:4px;background:var(--gem);color:#fff;font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;box-shadow:0 4px 14px rgba(124,77,255,.35)}
.bubble{white-space:pre-line;position:absolute;left:12px;right:12px;bottom:10px;background:rgba(255,255,255,.93);color:#1d2230;border-radius:12px;padding:7px 11px;font-size:12.5px;box-shadow:var(--shadow);animation:pop .25s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.info{flex:none;padding:8px 12px 4px;display:grid;gap:3px;font-size:12.5px}
.info .l1{font-weight:700;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.info .l2{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:6px 12px 12px}
.act{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px 4px;height:76px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow);font-weight:700;font-size:13px}
.act small{font-size:10px;color:var(--muted);font-weight:500;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act.empty{background:transparent;border:1.5px dashed var(--line);box-shadow:none}
.act.empty small{opacity:.7}
.act:active:not(:disabled){transform:scale(.96)}
.act.dim{opacity:.42}
.act .ic{color:var(--accent)}

/* ---- 투자 ---- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:grid;gap:4px;box-shadow:var(--shadow)}
.tile .ic{color:var(--accent);margin-bottom:4px}
.tile.wide{grid-column:span 2}
.tile b{font-size:16px}.tile span{font-size:12px;color:var(--muted)}
.tile i{font-style:normal;font-size:13px;font-weight:700}
.list{display:grid}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:6px;min-width:0}
.li .nm em{font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ds{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .pr{text-align:right;font-weight:600;font-size:13.5px}
.li .ch{text-align:right;font-size:12px}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.badge.gem{background:var(--gem-soft);color:var(--gem)}
.badge.lock{background:var(--surface2);color:var(--muted)}
.badge.upb{background:color-mix(in srgb,var(--up) 14%,var(--surface));color:var(--up)}
.badge.downb{background:color-mix(in srgb,var(--down) 14%,var(--surface));color:var(--down)}
.badge.love{background:color-mix(in srgb,var(--love) 15%,var(--surface));color:var(--love)}

/* ---- 탭 칩 ---- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;min-height:40px;flex:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:700;display:flex;align-items:center;gap:4px}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips button.locked{color:var(--muted)}

/* ---- 버튼 ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:#fff;border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px}
.btn.buy{background:var(--up)}.btn.sell{background:var(--down)}
.btn.ghost{background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
.btn.gem{background:var(--gem)}
.btn.sm{padding:7px 10px;font-size:12.5px;border-radius:10px}
.btn:active:not(:disabled){transform:scale(.97)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qty{display:grid;grid-template-columns:40px 1fr 40px;gap:6px;align-items:center}
.qty input{width:100%;text-align:center;padding:9px 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);font-weight:700}
.qty button{height:40px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{flex:1;min-width:56px;padding:6px 4px;border-radius:9px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:600}
.note{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px}
.note.warn{color:var(--warn)}
.note.gem{color:var(--gem);background:var(--gem-soft)}

/* ---- 기억 떠올리기 ---- */
.memo-box{margin-top:10px;border-radius:12px;background:var(--gem-soft);padding:10px 12px}
.fut-list{display:grid;grid-template-columns:auto 1fr auto;gap:3px 12px;font-size:12.5px;align-items:center}
.fut-list b{text-align:right;font-weight:700}
.est-head{width:100%;text-align:left}
.cost-row{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:8px}
.cost-row span{background:var(--surface2);border-radius:8px;padding:4px 2px;text-align:center;font-size:12px}
.cost-row small{display:block;font-size:9.5px;color:var(--muted)}

/* ---- 부동산 두 열 카드 ---- */
.est-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.est-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0}
.est-card.open{grid-column:span 2}
.est-pic{position:relative;display:block;width:100%;aspect-ratio:4/3;background:var(--surface2);overflow:hidden}
.est-card.open .est-pic{aspect-ratio:16/7}
.est-img{width:100%;height:100%;object-fit:cover;display:block}
.est-pic .badge{position:absolute;left:6px;top:6px}
.est-pic .badge+.badge{left:auto;right:6px}
.est-card.locked .est-img{filter:grayscale(1) opacity(.55)}
.est-info{padding:8px 10px 0;display:grid;gap:1px;min-width:0}
.est-info>b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.est-info .sub{font-size:11.5px}
.est-info .row b{font-size:14px}
.est-detail{padding:4px 10px 0}
.est-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px 2px}
.sheet-foot{flex:none;background:var(--surface);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 18px rgba(0,0,0,.07)}
.dock{display:grid;gap:6px}
.dock-row{display:flex;align-items:center;gap:8px;min-width:0}
.dock .seg.side{flex:none}
.dock .seg.side button{padding:7px 16px;font-size:13.5px}
.dock-info{margin-left:auto;text-align:right;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock .qty-range{height:28px;margin:0}
.dock-est{margin-left:auto;text-align:right;font-size:11.5px}
.dock .quick.q4{flex:1.2;gap:4px}
.dock .quick button{padding:9px 2px}
.dock-go{flex:1;padding:10px 8px;white-space:nowrap}
.pop{position:absolute;inset:0;z-index:70;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:20px 18px;animation:fade .15s ease-out}
.pop-card{width:100%;max-width:340px;max-height:90%;overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:18px;padding:18px 16px 14px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;gap:7px;text-align:center;animation:pop .22s ease-out}
.pop-card h3{font-size:16.5px;margin:0;line-height:1.35}
.pop-kind{font-size:12px;font-weight:700;color:var(--muted)}
.pop-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin:0 auto 2px;background:var(--surface2);color:var(--muted)}
.pop-ic.up{background:color-mix(in srgb,var(--up) 14%,var(--surface));color:var(--up)}
.pop-ic.down{background:color-mix(in srgb,var(--down) 14%,var(--surface));color:var(--down)}
.pop-big{font-size:27px;font-weight:900;letter-spacing:-.5px}
.pop-big small{font-size:14px;font-weight:700;margin-left:6px}
.pop-card .kv{text-align:left;background:var(--surface2);border-radius:12px;padding:10px 12px}
.pop-card .kv .strong{font-weight:800}
.kv-h{color:var(--ink)!important;font-weight:700!important}
.pop-card .btn{width:100%;margin-top:4px}
.bars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin:6px 0 2px}
.barcol{display:grid;grid-template-rows:38px 38px auto auto;justify-items:center;font-size:11px;min-width:0}
.bhalf{width:56%;display:flex}
.bhalf.hi{align-items:flex-end;border-bottom:1px solid var(--line)}
.bhalf.lo{align-items:flex-start}
.bhalf i{display:block;width:100%;border-radius:4px 4px 0 0}
.bhalf i.bu{background:var(--up)}.bhalf i.bd{background:var(--down);border-radius:0 0 4px 4px}
.barcol b{margin-top:4px;color:var(--muted);font-weight:600}
.barcol span{font-size:10.5px;font-weight:700;white-space:nowrap}
.fin-link{width:100%;text-align:left;display:block;color:var(--ink)}
.fin-more{display:flex;align-items:center;justify-content:flex-end;gap:2px;margin-top:6px;font-size:12px;font-weight:700;color:var(--accent)}
.fin-rows{display:grid;gap:6px;margin-top:10px}
.fin-row{display:grid;grid-template-columns:10px 1fr auto 46px;gap:8px;align-items:center;font-size:13px}
.fin-row>i{width:10px;height:10px;border-radius:3px}
.fin-row b{font-weight:600}.fin-row small{font-size:11px;text-align:right}
.li.per[disabled]{opacity:.75}
.note.link{display:flex;align-items:center;gap:8px;width:100%;text-align:left;color:var(--ink)}
.note.link span{flex:1}.note.link .ic{color:var(--accent);flex:none}
.tile em{font-style:normal}.tile em.warn{color:var(--warn);font-weight:700}
.home-card{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center}
.home-pic{width:88px;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.home-txt{display:grid;gap:2px;min-width:0}.home-txt small{font-size:11px;color:var(--muted)}.home-txt b{font-size:15.5px}.home-txt .sub{font-size:11.5px}
.mgr-list{display:grid;gap:10px;margin-bottom:10px}
.mgr-card{display:grid;grid-template-columns:108px 1fr;gap:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:var(--shadow)}
.mgr-pic{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;background:var(--surface2);align-self:start}
.mgr-pic .badge{position:absolute;left:5px;top:5px;display:inline-flex;align-items:center;gap:2px;background:var(--gold);color:#fff}
.mgr-body{display:grid;gap:4px;min-width:0;align-content:start}
.mgr-body>b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mgr-body .sub{font-size:11.5px;line-height:1.45}
.mgr-card .seg,.mgr-live{grid-column:1/-1}
.seg.lease button{display:grid;gap:1px;line-height:1.25;padding:6px 4px}
.seg.lease button small{font-size:10px;font-weight:600;opacity:.85}
.seg.lease button.on.wolse{background:var(--good);color:#fff}
.seg.lease button.on.jeonse{background:var(--down);color:#fff}
.pips{display:flex;flex-wrap:wrap;gap:3px}
.pip{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--line);flex:none}
.pip.home{background:var(--gold)}.pip.wolse{background:var(--good)}.pip.jeonse{background:var(--down)}.pip.empty{background:transparent;border:1.5px dashed var(--muted)}
.pip-legend{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;font-size:11.5px;color:var(--muted);margin:2px 2px 8px}
.pip-legend .pip{margin-right:-8px}
.empty-state{display:grid;justify-items:center;gap:10px;padding:36px 12px;text-align:center;color:var(--muted)}
.empty-state b{color:var(--ink);font-size:16px}
.est-cost{padding:0 10px 8px;font-size:10.5px;text-align:center}

/* ---- 기억해내기 버튼 ---- */
.reveal-btns{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px;align-items:center;width:100%}
.reveal-btns .btn{flex-direction:column;gap:0;padding:6px 4px;line-height:1.2}
.reveal-btns .btn small{font-size:10.5px;font-weight:600;opacity:.9}

/* ---- 내기 창 ---- */
.story-art.bet-art{flex:0 0 18%}
.story-box.bet-box{max-height:none;flex:1 1 auto;min-height:0;gap:8px}
.bet-q{font-size:16px;font-weight:900}
.bet-stake{background:var(--surface2);border-radius:12px;padding:8px 10px}
.bet-opts{display:grid;gap:6px}
.bet-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--surface2);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;font-weight:700;font-size:14px}
.bet-opt span small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.bet-opt b{font-size:12px;color:var(--accent);white-space:nowrap}
.bet-opt.on{border-color:var(--accent);background:var(--accent-soft)}
.bet-opt.known{border-color:var(--gem);box-shadow:0 0 0 2px var(--gem-soft)}
.bet-opt .mem{font-style:normal;font-size:11px;color:var(--gem);font-weight:700}
.bet-mem{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--gem);font-size:13px;font-weight:700}

/* ---- 매수·매도창 ---- */
.seg.side button.on.buy{background:var(--up);color:#fff}
.seg.side button.on.sell{background:var(--down);color:#fff}
.qty-range{width:100%;height:36px;margin:2px 0;accent-color:var(--up);cursor:pointer}
.qty-range.sell{accent-color:var(--down)}
.qty-big{font-size:20px;font-weight:900;white-space:nowrap}
.quick.q4{display:grid;grid-template-columns:repeat(4,1fr)}
.quick.q4 button{min-width:0}

/* ---- 장비 등급 (N 흰색 · R 파랑 · SR 보라 · SSR 금색) ---- */
.grade{display:inline-grid;place-items:center;min-width:30px;padding:0 5px;height:18px;border-radius:5px;font-size:10px;font-weight:900;letter-spacing:.02em;flex:none;margin-right:2px}
.g-N.grade{background:#ffffff;color:#5c6470;border:1px solid #c9ced6}
.g-R.grade{background:#3b82f6;color:#fff}
.g-SR.grade{background:#9b59d0;color:#fff}
.g-SSR.grade{background:linear-gradient(135deg,#f7d774,#d99a1e);color:#3a2600}
.equip{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.eslot{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.eslot small{font-size:10.5px;color:var(--muted);font-weight:700}
.eslot b{font-size:13px;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.eslot span{font-size:11px;color:var(--muted)}
.eslot.g-N{border-color:#c9ced6}.eslot.g-R{border-color:#3b82f6}.eslot.g-SR{border-color:#9b59d0}.eslot.g-SSR{border-color:#d99a1e;background:color-mix(in srgb,#f7d774 14%,var(--surface2))}
.eslot:last-child:nth-child(odd){grid-column:span 2}
.statrow .bar{display:flex}
.statrow .bar i.plus{background:var(--gem);border-radius:0 4px 4px 0}

/* ---- 로또 ---- */
.balls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ball{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;font-weight:800;font-size:13px;flex:none;font-family:"IBM Plex Mono",monospace;box-shadow:inset -3px -4px 6px rgba(0,0,0,.18),inset 3px 3px 5px rgba(255,255,255,.35)}
.ball.hidden{background:var(--surface2);color:var(--muted);border:1px dashed var(--muted);box-shadow:none}
.ball.hit{outline:2px solid var(--gem);outline-offset:1px}
.balls .plus{color:var(--muted);font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
.lnum{height:32px;border-radius:8px;background:var(--surface2);border:1px solid var(--line);font-size:12.5px;font-weight:700;font-family:"IBM Plex Mono",monospace}
.lnum.known{border-color:var(--gem);color:var(--gem);border-width:2px}
.lnum.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ticket{display:flex;gap:5px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.ticket:last-child{border-bottom:0}
.ticket .ball{width:28px;height:28px;font-size:12px}
.ticket .sub{width:14px}
.ptable{display:grid;grid-template-columns:auto 1fr auto auto;gap:4px 10px;font-size:13px;align-items:center}

/* ---- 차트 ---- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1;fill:none}
.chart .ax{font-size:10px;fill:var(--muted);font-family:"IBM Plex Mono",monospace}
.chart-empty{font-size:12px;color:var(--muted);padding:20px 0;text-align:center}
.seg{display:inline-flex;background:var(--surface2);border-radius:9px;padding:2px}
.seg button{padding:4px 10px;border-radius:7px;font-size:12px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ---- 인연 ---- */
.seg.wide{display:flex;width:100%}
.seg.sort button{padding:6px 4px;font-size:12.5px}
.li .rank{display:inline-block;min-width:18px;font-size:11px;color:var(--muted);font-weight:700}.seg.wide button{flex:1;padding:7px 10px;font-size:13px}
.relmap{position:relative;width:100%;margin:4px 0}
.relmap-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.map-link{font-size:9.5px;font-weight:600;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round}
.map-link.bad{fill:var(--bad)}
.map-node,.map-me{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:1px;width:68px;text-align:center}
.map-node .face{width:44px;height:44px;border:2px solid var(--c);box-shadow:var(--shadow)}
.map-node b,.map-me b{font-size:11px;line-height:1.3;background:var(--surface);padding:0 4px;border-radius:6px;white-space:nowrap}
.map-node small,.map-me small{font-size:9.5px;color:var(--muted);line-height:1.1;white-space:nowrap}
.map-me .face{width:64px;height:64px;border:3px solid var(--gem);box-shadow:0 0 0 4px var(--gem-soft)}
.map-node .rel-chip{font-size:9.5px;font-weight:700;line-height:1.35;padding:0 6px;border-radius:999px;color:var(--c);background:var(--surface);border:1px solid var(--c);white-space:nowrap}
.map-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted);margin-top:6px}
.map-legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.map-legend .bad{color:var(--bad)}
.person{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.person:last-child{border-bottom:0}
.face{width:46px;height:46px;border-radius:50%;overflow:hidden;background:var(--surface2);border:1px solid var(--line);flex:none}
.face .pt{width:100%;height:100%;object-fit:cover;object-position:50% 6%;transform:scale(1.9);transform-origin:50% 12%}
.face svg{width:100%;height:100%;transform:scale(1.5) translateY(10%)}
.person .who{min-width:0;display:grid;gap:1px}
.person .who b{font-size:14px;display:flex;align-items:center;gap:6px}
.person .who b small{font-size:11px;color:var(--muted);font-weight:500}
.person .who span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rel{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.rel.love{background:color-mix(in srgb,var(--love) 14%,var(--surface));color:var(--love);border-color:transparent}
.affbar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.affbar i{display:block;height:100%;background:var(--love)}
.pf{position:relative;height:260px;border-radius:14px;overflow:hidden;background:linear-gradient(180deg,var(--surface2),var(--line))}
.pf .pt{position:absolute;left:50%;top:4%;height:165%;transform:translateX(-50%)}
.pf svg{position:absolute;left:50%;bottom:0;height:95%;transform:translateX(-50%)}
.say{background:var(--surface2);border-radius:12px;padding:9px 12px;font-size:13px;position:relative}
.say::before{content:"";position:absolute;left:18px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:var(--surface2)}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px}
.gifts button{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px;font-size:12px;text-align:left}
.gifts button b{display:block;font-size:13px}

/* ---- 상태 ---- */
.stack{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--surface2)}
.stack i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;margin-top:10px}
.legend b{font-weight:500;display:flex;align-items:center;gap:6px}
.legend b i{width:10px;height:10px;border-radius:3px;display:inline-block}
.statrow{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.statrow .bar{height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.statrow .bar i{display:block;height:100%;border-radius:4px;background:var(--accent)}

/* ---- 시트(팝업) ---- */
.sheet{position:absolute;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;animation:fade .18s ease-out}
.sheet-panel{width:100%;max-height:94%;height:94%;background:var(--bg);border-radius:18px 18px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out;overflow:hidden}
.sheet-panel.short{height:auto}
.sheet-head{flex:none;display:flex;align-items:center;gap:8px;padding:12px 12px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-head h2{margin:0;font-size:16px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:12px;display:grid;gap:12px;align-content:start;grid-auto-rows:max-content;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}

/* ---- 이벤트 팝업 ---- */
.story{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:calc(14px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom));animation:fade .25s ease-out;cursor:pointer}
.story-card{width:100%;height:100%;max-height:760px;background:#0c0e14;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s ease-out}
.story-art{position:relative;flex:1 1 55%;min-height:0;overflow:hidden}
.story-art .art-scene,.story-art .art-scene svg{position:absolute;inset:0;width:100%;height:100%}
.story-art .art-char{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,#3b4466,#141826 70%)}
.story-art .art-char .pt{position:absolute;left:50%;top:3%;height:175%;transform:translateX(-50%);animation:pop .3s ease-out}
.story-art .art-char svg{position:absolute;left:50%;bottom:0;height:92%;transform:translateX(-50%)}
.story-title{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.5);color:#fff;font-size:12px;font-weight:700;padding:4px 11px;border-radius:999px}
.story-box{flex:none;min-height:34%;max-height:60%;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;margin-top:-18px;position:relative;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:default}
.story-name{align-self:flex-start;font-weight:900;font-size:14px;padding:3px 12px;border-radius:999px;background:var(--ink);color:var(--bg)}
.story-name.me{background:var(--gem);color:#fff}
.story-text{font-size:15.5px;line-height:1.75;white-space:pre-wrap;min-height:4.5em}
.story-text.narr{color:var(--muted);font-size:15px}
.story-text.mono{font-style:italic}
.story-next{align-self:flex-end;font-size:12px;color:var(--muted);animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.story-choices{display:grid;gap:8px;margin-top:auto}
.story-choices button{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px}
.story-choices button:active:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.story-choices button small{display:block;font-size:11.5px;font-weight:500;color:var(--bad);margin-top:2px}

/* ---- 로그 ---- */
.logs{display:grid;gap:6px}
.logs div{font-size:12.5px;padding:7px 10px;border-radius:9px;background:var(--surface);border-left:3px solid var(--line)}
.logs div time{display:block;font-size:10.5px;color:var(--muted)}
.logs .memo{border-left-color:var(--gem);background:var(--gem-soft)}
.logs .good{border-left-color:var(--good)}.logs .bad{border-left-color:var(--bad)}.logs .warn{border-left-color:var(--warn)}.logs .love{border-left-color:var(--love)}.logs .blue{border-left-color:var(--accent)}

/* ---- 시작 화면 ---- */
.title{position:absolute;inset:0;z-index:80;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;background:linear-gradient(180deg,rgba(10,12,22,.1),rgba(10,12,22,.92) 62%),#0e1424}
.title .art{position:absolute;inset:0;opacity:.8}
.title .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,12,22,0) 25%,rgba(10,12,22,.96) 66%)}
.title .art svg{width:100%;height:100%}
.title-in{position:relative;padding:24px 20px calc(28px + env(safe-area-inset-bottom));display:grid;gap:12px}
.title h1{margin:0;font-size:34px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
.title h1 small{display:block;font-size:15px;font-weight:500;letter-spacing:.3em;color:#a9b4ff;margin-bottom:6px}
.title p{margin:0;color:#c6cbe0;font-size:14px;line-height:1.6}
.title input{width:100%;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-weight:700}
.title .dev{font-size:11px;color:#8d96b8}

/* ---- 토스트 ---- */
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%);z-index:90;background:rgba(20,24,34,.92);color:#fff;font-size:13px;padding:9px 14px;border-radius:12px;max-width:88%;text-align:center;pointer-events:none;animation:pop .2s ease-out}
.toast[hidden]{display:none}
</style>
</head>

// ---- 기록 ----

// ---- 시세 ----
// 한 달에 가격 하나: 그달 실제 월말 종가
function splitRatio(id, mi) {

}
function priceAt(id, mi) { const s = MARKET.s[id]; return s && mi >= 0 && mi <= LAST_MI ? s.c[mi] : null; }
function price(id) { return priceAt(id, S.mi); }
// 지난달 종가를 지금 주식 수 기준으로 (이번 달 분할 반영)

}
const tkName = (id, ym) => byDate(TK[id].names || TK[id].name, ym || curYM());
const tkTab = (id, ym) => byDate(TK[id].tab, ym || curYM());

// 지난달 대비 등락률
function changePct(id) { const p0 = prevPrice(id), p = price(id); return p0 ? (p / p0 - 1) * 100 : 0; }

function tabOpen(tab) { const t = TABS.find(x => x.id === tab); return curYM() >= t.open; }
// 분할 반영 연속 시계열 (차트용): 지금 주식 수 기준으로 맞춘다
// 과거 값은 그 뒤 지금까지의 분할 비율로 나누고, 미래 값은 지금부터 그때까지의 분할 비율을 곱한다
function adjSeries(id, toMi) {
  const s = MARKET.s[id], out = [];
  for (let mi = 0; mi <= toMi && mi <= LAST_MI; mi++) {
    if (s.c[mi] == null) { out.push(null); continue; }
    let f = 1;
    for (const [m, r] of s.sp) {
      const k = miOf(m);
      if (mi <= S.mi && k > mi && k <= S.mi) f /= r;
      if (mi > S.mi && k > S.mi && k <= mi) f *= r;
    }

  }

}

// ---- 시가총액 (원) ----
// 지금 주식 수를 그달의 주식 수로 되돌려(그 뒤 분할 비율로 나눠) 그달 종가를 곱한다. 증자·자사주 소각은 반영하지 못한 근사값
// 코인은 유통량(비트코인·이더리움은 연도별), ETF 는 지금 순자산을 가격 흐름으로 되돌린 값. 정보가 없으면 0
function mcapAt(id, mi) {
  const s = MARKET.s[id], p = priceAt(id, mi); if (!s || p == null) return 0;
  const fx = TK[id].cur === 'USD' ? macroAt('fx', mi) : 1;
  let f = 1; for (const [m, r] of s.sp) if (miOf(m) > mi) f *= r;

}
const mcap = id => mcapAt(id, S.mi);
// 종목 정렬: base 기본 순서 · cap 시가총액 큰 순 · up 이번 달 상승률 순 · down 하락률 순
function sortTickers(list, how) {
  const key = { cap: t => -mcap(t.id), up: t => -changePct(t.id), down: t => changePct(t.id) }[how];
  return key ? list.map((t, i) => [t, key(t), i]).sort((a, b) => a[1] - b[1] || a[2] - b[2]).map(x => x[0]) : list;
}

// ---- 주식·ETF·코인 거래 ----
// 매매 비용률 (한 번 사거나 팔 때). 해외 주식은 수수료에 환전 비용이 붙는다
function feeRate(id) { const ym = curYM(); return isCoin(id) ? feeCoin(ym) : TK[id].cur === 'USD' ? feeUSComm(ym) + fxSpread(ym) : feeKR(ym); }
const sellTaxRate = id => TK[id].cur === 'KRW' && TK[id].tab !== 'ETF' ? sellTax(curYM()) : 0;

function qtyStep(id) { return isCoin(id) ? 0.0001 : 1; }
function roundQty(id, q) { const st = qtyStep(id); return Math.floor(q / st + 1e-9) * st; }

function maxBuy(id) {

  return Math.max(0, roundQty(id, Math.min(S.cash, room) / u));
}
function canTrade(id) {
  if (!S.flags.account) return '아직 증권 계좌가 없습니다.';
  if (!listed(id)) return '아직 상장되지 않았습니다.';
  if (!tabOpen(TK[id].tab === 'COIN' ? 'COIN' : tkTab(id))) return '아직 열리지 않은 시장입니다.';
  return '';
}
function buy(id, q) {
  const why = canTrade(id); if (why) return fail(why);
  q = roundQty(id, q);
  if (!(q > 0)) return fail('수량을 확인하세요.');
  const gross = unitKRW(id) * q, fee = gross * feeRate(id);
  if (gross + fee > S.cash + 1e-6) return fail('현금이 부족합니다.');
  if (holdValue(id) + gross > holdCap(id)) return fail('시장에서 더 살 물량이 없습니다. 한 종목 한도 ' + fmtWon(holdCap(id)));
  S.cash -= gross + fee; S.feePaid += fee;
  const h = S.hold[id] || (S.hold[id] = { q: 0, cost: 0 });
  h.q += q; h.cost += gross + fee;
  log(`${tkName(id)} ${fmtQty(id, q)} 매수 · ${fmtWon(gross + fee)}`, 'blue');

}
function sell(id, q) {
  const h = S.hold[id];
  if (!h || h.q <= 0) return fail('보유 수량이 없습니다.');
  if (!listed(id)) return fail('거래할 수 없습니다.');
  q = Math.min(h.q, q >= h.q - 1e-9 ? h.q : roundQty(id, q));

  const gross = unitKRW(id) * q;
  const tax = gross * sellTaxRate(id), fee = gross * feeRate(id);
  const net = gross - fee - tax;

  if (isUSStock(id)) S.usGain[year()] = (S.usGain[year()] || 0) + net - costPart;   // 해외 주식 양도소득세 계산용
  h.q -= q; h.cost -= costPart;

  return ok({ kind: 'sold', title: '매도 체결', name: tkName(id), what: `${fmtQty(id, q)} × ${fmtPrice(id, price(id))}`, pl: net - costPart, cost: costPart,
    rows: [['판 금액', gross], ['수수료', -fee], ...(tax ? [['거래세', -tax]] : []), ['받은 돈', net, 1], ['산 금액 (평단 × 수량)', costPart]] });
}
function holdValue(id) { const h = S.hold[id]; return h && listed(id) ? h.q * unitKRW(id) : 0; }

// ---- 선물 ----
function futPrice(fid) { return macro(FUT[fid].idx); }
function futMultKRW(fid, pos) {
  const f = FUT[fid]; const m = pos ? pos.mult : f.mult(curYM());
  return m * (f.cur === 'USD' ? fxNow() : 1);
}
function futOpen(fid) { return curYM() >= FUT[fid].open && tabOpen('FUT'); }
function openFut(fid, dir, q) {
  if (!S.flags.account) return fail('아직 증권 계좌가 없습니다.');
  if (!futOpen(fid)) return fail('아직 상장되지 않았습니다.');

  const pos = S.fut[fid]; if (!pos) return fail('포지션이 없습니다.');
  const pl = futPL(fid), fee = futPrice(fid) * futMultKRW(fid, pos) * pos.q * FUT_FEE;
  S.cash += pos.margin + pl - fee; S.realized += pl - fee; S.feePaid += fee;

  log(`${FUT[fid].name} ${forced ? '강제 청산' : '청산'} · 손익 ${fmtSigned(pl)}`, pl >= 0 ? 'good' : 'bad');
  return ok({ kind: 'sold', title: '청산 체결', name: FUT[fid].name, what: `${pos.dir > 0 ? '매수' : '매도'} ${pos.q}계약 · ${futPrice(fid).toFixed(2)}`, pl: pl - fee, cost: pos.margin,
    rows: [['맡긴 증거금', pos.margin], ['가격 손익', pl], ['수수료', -fee], ['받은 돈', pos.margin + pl - fee, 1]] });
}

  }
}

// ---- 옵션 (코스피200, 달마다 만기) ----
function normCdf(x) { const t = 1 / (1 + 0.2316419 * Math.abs(x)); const d = 0.3989423 * Math.exp(-x * x / 2); const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; }
function bs(type, s, k, T, r, v) {
  if (T <= 0) return Math.max(0, type === 'C' ? s - k : k - s);
  const d1 = (Math.log(s / k) + (r + v * v / 2) * T) / (v * Math.sqrt(T)), d2 = d1 - v * Math.sqrt(T);
  return type === 'C' ? s * normCdf(d1) - k * Math.exp(-r * T) * normCdf(d2) : k * Math.exp(-r * T) * normCdf(-d2) - s * normCdf(-d1);
}
function optVol(mi) {
  const a = MARKET.m.kospi, rs = [];
  for (let i = Math.max(1, mi - 12); i < mi; i++) if (a[i] && a[i - 1]) rs.push(Math.log(a[i] / a[i - 1]));
  if (rs.length < 3) return 0.3;
  const m = rs.reduce((s, x) => s + x, 0) / rs.length;
  const sd = Math.sqrt(rs.reduce((s, x) => s + (x - m) ** 2, 0) / (rs.length - 1)) * Math.sqrt(12);
  return Math.min(0.8, Math.max(0.15, sd));
}
// 이번 달 종가로 사서 다음 달 종가로 정산하는 한 달짜리 옵션
function optChain() {
  const s0 = macro('ks200');
  const ks = [...new Set(OPT_STRIKES.map(k => Math.round(s0 * (1 + k) / 2.5) * 2.5))];
  return ks.map(K => ({ K }));
}
function optPremium(type, K) { // 포인트, 남은 기간 한 달
  const r = (MARKET.m.cd[S.mi] || 3) / 100;
  return Math.max(0.01, bs(type, macro('ks200'), K, 1 / 12, r, optVol(S.mi)));
}
function buyOpt(type, K, q) {
  if (!S.flags.account) return fail('아직 증권 계좌가 없습니다.');
  if (!tabOpen('OPT')) return fail('아직 상장되지 않았습니다.');
  q = Math.floor(q); if (!(q > 0)) return fail('수량을 확인하세요.');
  const held = S.opt.filter(o => o.mi === S.mi).reduce((s, o) => s + o.q, 0);
  if (held + q > POS_LIMIT.opt) return fail('이번 달 옵션 한도는 ' + POS_LIMIT.opt + '계약입니다.');
  const prem = optPremium(type, K) * OPT_MULT * q, fee = prem * OPT_FEE, cost = prem + fee;
  if (cost > S.cash) return fail('현금이 부족합니다.');
  S.cash -= cost; S.feePaid += fee;
  const o = S.opt.find(x => x.mi === S.mi && x.type === type && x.K === K);
  if (o) { o.q += q; o.cost += cost; } else S.opt.push({ mi: S.mi, exp: S.mi + 1, type, K, q, cost });
  log(`코스피200 ${type === 'C' ? '콜' : '풋'} ${K} ${q}계약 매수 · ${fmtWon(cost)}`, 'blue');
  return ok();
}
// 옵션은 산 달에만 들고 있으므로 남은 기간은 늘 한 달이다
function optValue(o) { return optPremium(o.type, o.K) * OPT_MULT * o.q; }
function sellOpt(i) {
  const o = S.opt[i]; if (!o) return fail('포지션이 없습니다.');
  const fee = optValue(o) * OPT_FEE, v = optValue(o) * 0.97 - fee;
  S.cash += v; S.realized += v - o.cost; S.feePaid += fee; S.opt.splice(i, 1);
  log(`코스피200 ${o.type === 'C' ? '콜' : '풋'} ${o.K} 매도 · 손익 ${fmtSigned(v - o.cost)}`, v >= o.cost ? 'good' : 'bad');
  return ok({ kind: 'sold', title: '매도 체결', name: `코스피200 ${o.type === 'C' ? '콜' : '풋'} ${o.K}`, what: `${o.q}계약`, pl: v - o.cost, cost: o.cost,
    rows: [['수수료', -fee], ['받은 돈', v, 1], ['산 금액', o.cost]] });
}
// 월말 정산 때 부른다. 다음 달 종가로 만기 정산한다 (마지막 달이면 이번 달 종가)

  S.opt = S.opt.filter(o => {

    const pay = Math.max(0, o.type === 'C' ? s - o.K : o.K - s) * OPT_MULT * o.q;
    S.cash += pay; S.realized += pay - o.cost;
    log(`옵션 만기 · ${o.type === 'C' ? '콜' : '풋'} ${o.K} → ${pay > 0 ? fmtWon(pay) + ' 지급' : '소멸'} (손익 ${fmtSigned(pay - o.cost)})`, pay > o.cost ? 'good' : 'bad');

// ---- 채권 ----
function bondYield(bid, mi) {

}

function buyBond(bid, amtKRW) {

}

// ---- 은행 ----
const depRate = () => Math.max(0.1, (MARKET.m.cd[S.mi] || 3) + DEPOSIT_SPREAD);

  return Math.max(0, Math.floor(lim));
}
function deposit(a) { a = Math.floor(a); if (!(a > 0) || a > S.cash) return fail('금액을 확인하세요.'); S.cash -= a; S.bank.dep += a; log('예금 ' + fmtWon(a), 'blue'); return ok(); }
function withdraw(a) { a = Math.floor(Math.min(a, S.bank.dep)); if (!(a > 0)) return fail('금액을 확인하세요.'); S.bank.dep -= a; S.cash += a; log('예금 인출 ' + fmtWon(a), 'blue'); return ok(); }

  const si = snsIncome(); if (si) { S.cash += si; parts.push('SNS 수입 +' + fmtWon(si)); }
  if (!S.mo.sns && S.st.fame > 0) S.st.fame = Math.max(0, S.st.fame - FAME_DECAY);   // 글을 안 올리면 잊힌다
  const lc = livingCost(); if (lc) { S.cash -= lc; parts.push('생활비 -' + fmtWon(lc)); }
  if (S.bank.dep > 0) { const it = S.bank.dep * depRate() / 1200 * (1 - INTEREST_TAX); S.bank.dep += it; S.intTotal += it; parts.push('예금 이자 +' + fmtWon(it)); }
  if (S.bank.loan > 0) { const it = S.bank.loan * loanRate() / 1200; S.cash -= it; parts.push('대출 이자 -' + fmtWon(it)); }
  let cp = 0;
  S.bonds = S.bonds.filter(pos => {
    const b = BOND[pos.b];
    cp += pos.face * pos.y / 1200 * (1 - INTEREST_TAX) * bondFx(b);
    if (S.mi + 1 >= pos.mat) { S.cash += pos.face * bondFx(b); log(`${b.name} 만기 상환 · ${fmtWon(pos.face * bondFx(b))}`, 'good'); return false; }
    return true;
  });
  if (cp) { S.cash += cp; S.intTotal += cp; parts.push('채권 이자 +' + fmtWon(cp)); }
  const ls = leaseMonth();
  if (ls.rent) { S.cash += ls.rent; S.rentTotal += ls.rent; parts.push('월세 +' + fmtWon(ls.rent)); }
  if (ls.tax) { S.cash -= ls.tax; S.taxPaid += ls.tax; parts.push('보유세 -' + fmtWon(ls.tax)); }
  if (ls.empty) { S.cash -= ls.empty; parts.push('빈 집 관리비 -' + fmtWon(ls.empty)); }
  renewJeonse();
  const dv = payDividends(); if (dv) parts.push('배당 +' + fmtWon(dv));
  settleOptions();

  if (S.cash < 0 && S.bank.dep > 0) { const a = Math.min(S.bank.dep, -S.cash); S.bank.dep -= a; S.cash += a; parts.push('예금에서 부족분 ' + fmtWon(a) + ' 인출'); }
  if (S.cash < 0) { const it = -S.cash * OVERDRAFT_RATE; S.cash -= it; parts.push('연체 이자 -' + fmtWon(it)); }
  log(`${year()}년 ${month()}월 정산 · ${parts.join(' · ') || '변동 없음'}`, '');
}
// before: 넘기기 직전 순자산. 이달 수익은 여기서부터 잰다 (시세 변동 + 월말 정산 + 이번 달 행동)
function newMonth(before) {
  // 액면분할·병합: 보유 수량을 같은 비율로 바꾼다
  for (const id of Object.keys(S.hold)) {
    const r = splitRatio(id, S.mi);
    if (r !== 1) { S.hold[id].q *= r; log(`${tkName(id)} 주식 ${r >= 1 ? '분할' : '병합'} · 보유 수량 ×${+r.toFixed(4)}`, 'blue'); }
  }
  if (month() === US_GAIN_TAX.month) {   // 지난해 해외 주식 차익의 양도소득세
    const y = year() - 1, g = S.usGain[y] || 0, tax = Math.max(0, g - US_GAIN_TAX.free) * US_GAIN_TAX.rate;
    if (tax > 0) { S.cash -= tax; S.taxPaid += tax; log(`${y}년 해외 주식 양도소득세 -${fmtWon(tax)} (차익 ${fmtWon(g)}에서 ${fmtWon(US_GAIN_TAX.free)} 빼고 ${US_GAIN_TAX.rate * 100}%)`, 'warn'); }
    delete S.usGain[y];
  }
  if (month() === 2 && age() <= 19) { const nm = won100(NEWYEAR_MONEY * cpiF()); S.cash += nm; log('설날 세뱃돈 +' + fmtWon(nm), 'good'); }
  for (const k of Object.keys(S.reveal)) if (S.reveal[k] <= S.mi) delete S.reveal[k];
  S.sta = maxSta(); S.mo = {};
  newLotto();
  S.hints = memoryHints();
  for (const h of S.hints) log('💭 ' + h.t, 'memo');
  if (partners().length >= 2 && rand() < cheatRisk()) enqueue('caught:' + S.mi);
  settleBets();
  S.monthStartNW = before == null ? netWorth() : before;
  const gain = netWorth() - S.monthStartNW;
  log(`${year()}년 ${month()}월 · 지난달보다 자산 ${fmtSigned(gain)}`, gain >= 0 ? 'good' : 'bad');
  record();
}

// ---- 결산 ----
// 기록은 달이 시작될 때 남는다. 그 달 기록이 없으면(게임 시작 전) 처음 기록을 쓴다
const histAt = mi => S.hist.find(h => h.mi >= mi);
// 4·7·10월로 넘어오면 지난 분기, 1월이면 지난 한 해를 결산한다
function periodDue() {
  const m = month();
  if (m === 1) return periodReport(S.mi - 12, S.mi, 'year');
  if (m % 3 === 1) return periodReport(S.mi - 3, S.mi, 'q');
  return null;
}
function periodReport(mi0, mi1, kind) {
  const a = histAt(mi0), b = histAt(mi1);
  if (!a || !b || a === b) return null;
  const d = k => a[k] == null || b[k] == null ? null : b[k] - a[k];
  const ym = ymOf(mi1 - 1), y = +ym.slice(0, 4), m = +ym.slice(5), q = Math.ceil(m / 3);
  const step = (s, e, l) => { const x = histAt(s), z = histAt(e); return { l, v: x && z && x !== z && z.mi <= mi1 ? z.nw - x.nw : null }; };
  const steps = kind === 'year' ? [0, 1, 2, 3].map(k => step(mi0 + k * 3, mi0 + k * 3 + 3, (k + 1) + '분기'))
    : [0, 1, 2].map(k => step(mi0 + k, mi0 + k + 1, +ymOf(mi0 + k).slice(5) + '월'));
  return { kind: 'report', period: kind, mi0: a.mi, mi1: b.mi,
    title: kind === 'year' ? y + '년 결산' : `${y}년 ${q}분기 결산`,
    sub: kind === 'year' ? `${y}년 한 해 동안` : `${q * 3 - 2}월부터 ${q * 3}월까지`,
    nw0: a.nw, nw1: b.nw, chg: b.nw - a.nw, pct: a.nw > 0 ? (b.nw / a.nw - 1) * 100 : null,
    kospi: (macroAt('kospi', b.mi) / macroAt('kospi', a.mi) - 1) * 100, steps,
    parts: [['현금·예금', d('liq')], ['주식·파생·채권', d('inv')], ['부동산', d('re')], ['명품', d('lux')], ['빚 (대출·전세 보증금)', d('debt') == null ? null : -d('debt')]],
    flows: [['실현 손익', d('rl')], ['배당', d('dv')], ['월세', d('rent')], ['이자', d('it')], ['수수료·세금', d('cost') == null ? null : -d('cost')]] };
}
// 지금 다 팔면 생길 손익 (아직 실현하지 않은 것)
function unrealized() {
  let s = 0;
  for (const id of Object.keys(S.hold)) s += holdValue(id) - S.hold[id].cost;
  for (const fid of Object.keys(S.fut)) s += futPL(fid);
  for (const o of S.opt) s += optValue(o) - o.cost;
  for (const pos of S.bonds) s += bondValue(pos) - pos.face * (BOND[pos.b].cur === 'USD' ? MARKET.m.fx[pos.mi0] : 1);
  for (const id of Object.keys(S.re)) s += estatePrice(id) * S.re[id].q - S.re[id].cost;
  for (const id of Object.keys(S.lux)) s += luxValue(id) * S.lux[id] - S.luxCost[id];
  return s;
}
// 이번 달이 끝날 때 들어오고 나갈 돈 (예상)
function monthFlow() {
  const ls = leaseMonth();
  let cp = 0; for (const pos of S.bonds) cp += pos.face * pos.y / 1200 * (1 - INTEREST_TAX) * bondFx(BOND[pos.b]);
  const inc = [['SNS 수입', snsIncome()], ['예금 이자 (세후)', S.bank.dep * depRate() / 1200 * (1 - INTEREST_TAX)], ['채권 이자 (세후)', cp], ['월세', ls.rent]];
  const out = [['생활비', livingCost()], ['대출 이자', S.bank.loan * loanRate() / 1200], ['부동산 보유세', ls.tax], ['빈 집 관리비', ls.empty]];
  return { inc: inc.filter(r => r[1] >= 1), out: out.filter(r => r[1] >= 1) };

// ---- 자산 ----
function breakdown() {
  const b = { cash: S.cash, dep: S.bank.dep, KS: 0, KQ: 0, US: 0, ETF: 0, COIN: 0, fut: 0, opt: 0, bond: 0, estate: 0, lux: 0, loan: S.bank.loan, jdep: jeonseTotal() };
  for (const id of Object.keys(S.hold)) { const t = TK[id].tab === 'COIN' ? 'COIN' : TK[id].tab === 'ETF' ? 'ETF' : tkTab(id); b[t] += holdValue(id); }
  for (const fid of Object.keys(S.fut)) b.fut += S.fut[fid].margin + futPL(fid);
  for (const o of S.opt) b.opt += optValue(o);
  for (const pos of S.bonds) b.bond += bondValue(pos);
  for (const id of Object.keys(S.re)) b.estate += estatePrice(id) * S.re[id].q;
  for (const id of Object.keys(S.lux)) b.lux += luxValue(id) * S.lux[id];
  return b;
}
function netWorth() {
  const b = breakdown();
  return b.cash + b.dep + b.KS + b.KQ + b.US + b.ETF + b.COIN + b.fut + b.opt + b.bond + b.estate + b.lux - b.loan - b.jdep;
}
function investValue() { const b = breakdown(); return b.KS + b.KQ + b.US + b.ETF + b.COIN + b.fut + b.opt + b.bond; }

// ---- 보석 ----
const gemCount = () => DEV_INFINITE_GEMS ? Infinity : S.gems;
function spendGem(n) {

// 기억 떠올리기: 키(종목 id · 're:부동산 id' · 'idx:지수')마다 한 번에 한 달씩 더 멀리 본다

// 몇 달 뒤까지 한 번에 떠올린다. 비용은 아직 떠올리지 않은 달들의 비용을 모두 더한 값

  for (let mi = revealedTo(key) + 1; mi <= target; mi++) c += REVEAL_COST[mi - S.mi - 1];
  return c;
}

  if (months > REVEAL_COST.length) return fail('1년 뒤까지만 떠올릴 수 있습니다.');
  if (target <= revealedTo(key)) return fail(target >= LAST_MI ? '더 먼 미래의 기억은 없습니다.' : '이미 떠올렸습니다.');
  const c = revealCostTo(key, months);
  if (!spendGem(c)) return fail('');
  const from = revealedTo(key) + 1;
  S.reveal[key] = target;
  log(`💎${c} ${label || key} · ${fmtYM(from)}${from < target ? '~' + fmtYM(target) : ''} 시세를 떠올렸습니다.`, 'blue');

}
// 기억 더듬기: 앞으로 h개월 동안 가장 크게 오를·내릴 종목과 큰 사건
function recallFuture(h) {
  h = h || 12;
  const to = Math.min(LAST_MI, S.mi + h);
  const rows = [];
  for (const t of TICKERS) {
    if (!listed(t.id) || !listed(t.id, to)) continue;
    let f = 1; for (let mi = S.mi + 1; mi <= to; mi++) f *= splitRatio(t.id, mi);
    rows.push({ id: t.id, r: MARKET.s[t.id].c[to] * f / price(t.id) - 1 });
  }

function josa(w, a, b) {
  const c = String(w).charCodeAt(String(w).length - 1);

}
// 이번 달 종가 → 다음 달 종가로 크게 움직일 종목을 떠올린다. 지성이 높을수록 자주, 80부터는 두 개
function memoryHints() {
  const i = stat('int');
  if (i < HINT_MIN_INT || S.mi >= LAST_MI || rand() >= Math.min(0.9, (i - HINT_MIN_INT + 5) / 80)) return [];
  const cands = [];
  for (const t of TICKERS) {
    if (!listed(t.id) || !listed(t.id, S.mi + 1) || canTrade(t.id)) continue;
    const r = MARKET.s[t.id].c[S.mi + 1] * splitRatio(t.id, S.mi + 1) / price(t.id) - 1;
    if (Math.abs(r) >= (isCoin(t.id) ? HINT_MOVE.coin : HINT_MOVE.stock)) cands.push({ id: t.id, r });
  }
  const k = macroAt('kospi', S.mi + 1) / macro('kospi') - 1;
  if (Math.abs(k) >= HINT_MOVE.index) cands.push({ id: 'kospi', r: k });
  cands.sort((a, b) => Math.abs(b.r) - Math.abs(a.r));
  const pool = cands.slice(0, 5), out = [];
  for (let n = i >= 80 ? 2 : 1; n > 0 && pool.length; n--) out.push(pool.splice(Math.floor(rand() * pool.length), 1)[0]);
  return out.map(h => {
    const name = h.id === 'kospi' ? '코스피' : tkName(h.id), T = h.r > 0 ? HINT_UP : HINT_DOWN;
    return { id: h.id, up: h.r > 0, t: T[Math.floor(rand() * T.length)].replace('{N}', '「' + name + '」').replace('{이가}', josa(name, '이', '가')) };
  });
}

function lottoNums(n) { const a = []; while (a.length < n) { const k = 1 + Math.floor(rand() * 45); if (!a.includes(k)) a.push(k); } return a; }

// 그달에 배당락이 있으면 그달 말에 들고 있던 수량만큼 받는다 (세금을 떼고)
function divAt(id, mi) {
  const s = MARKET.s[id]; if (!s || !s.dv) return 0;
  const ym = ymOf(mi); let d = 0;
  for (const [m, v] of s.dv) if (m === ym) d += v;
  return d;
}
const divTax = id => DIV_TAX[TK[id].cur] || 0;
function payDividends() {
  let total = 0;
  for (const id of Object.keys(S.hold)) {
    const d = divAt(id, S.mi); if (!d || isCoin(id)) continue;
    const q = S.hold[id].q, gross = q * d * (TK[id].cur === 'USD' ? fxNow() : 1), tax = gross * divTax(id);
    S.cash += gross - tax; S.divTotal += gross - tax; S.taxPaid += tax; total += gross - tax;
    log(`배당금 · ${tkName(id)} 1주당 ${fmtPrice(id, d)} × ${fmtQty(id, q)} · +${fmtWon(gross - tax)} (세금 ${fmtWon(tax)})`, 'good');
  }
  return total;
}
// 최근 1년 1주당 배당 (지금 주식 수 기준). 미래 배당은 보이지 않는다
function trailingDiv(id) {
  const s = MARKET.s[id]; if (!s || !s.dv) return 0;
  let sum = 0;
  for (let mi = Math.max(0, S.mi - 11); mi <= S.mi; mi++) {
    const d = divAt(id, mi); if (!d) continue;
    let f = 1; for (const [m, r] of s.sp) { const k = miOf(m); if (k > mi && k <= S.mi) f *= r; }
    sum += d / f;
  }
  return sum;
}
function divMonths(id) {   // 최근 2년 동안 배당이 나온 달
  const s = MARKET.s[id]; if (!s || !s.dv) return [];
  return [...new Set(s.dv.filter(([m]) => miOf(m) > S.mi - 24 && miOf(m) <= S.mi).map(([m]) => +m.slice(5)))].sort((a, b) => a - b);
}

function buyGear(id) {

function equip(slot, id) {
  if (!S.gear[id]) return fail('가진 물건이 아닙니다.');
  if (!slotsFor(id).includes(slot)) return fail('이 칸에는 맞지 않습니다.');
  const worn = Object.entries(S.equip).filter(([s, v]) => v === id && s !== slot).length;
  if (worn >= S.gear[id]) return fail('하나밖에 없어서 이미 다른 손에 들고 있습니다.');
  S.equip[slot] = id; S.sta = Math.min(S.sta, maxSta());
  return ok();
}
function unequip(slot) { delete S.equip[slot]; S.sta = Math.min(S.sta, maxSta()); return ok(); }
function loseGear(id) {   // 선물하거나 잃으면 하나 줄이고, 입고 있던 것이 모자라면 벗는다
  S.gear[id]--; if (!S.gear[id]) delete S.gear[id];

  for (const s of worn.slice(S.gear[id] || 0)) unequip(s);

// ---- 그 시절 특별 이벤트 (스포츠 배당) ----
const betKind = () => age() < 20 ? BET_KINDS[0] : BET_KINDS[1];
const betFull = () => { const bk = betKind(); return Math.floor(bk.full * cpiF() / bk.unit) * bk.unit; };
// 실제 배당: 기준 금액까지는 그대로, 넘으면 이익 몫이 √(기준 ÷ 건 금액)만큼 줄어든다. 1배 아래로는 내려가지 않는다
function betOdds(q, k, stake) {
  const base = q.opts[k][1], full = betFull();
  const d = stake <= full ? 1 : Math.sqrt(full / stake);
  return Math.max(1, Math.floor((1 + (base - 1) * d) * 100) / 100);
}
// 내기 결과 떠올리기: 그 문항의 정답이 또렷해진다
function betRemember(qid) {
  const q = SPORT[qid]; if (!q) return fail('');
  if (S.betMem[qid]) return fail('이미 떠올렸습니다.');
  if (!spendGem(GEM_COST.bet)) return fail('');
  S.betMem[qid] = true;
  log(`💎${GEM_COST.bet} ${q.title} · 「${q.opts[q.win][0]}」${josa(q.opts[q.win][0], '이었다는', '였다는')} 기억이 또렷해졌습니다.`, 'blue');
  return ok(q.win);
}
function placeBet(qid, k, stake) {
  const q = SPORT[qid]; if (!q || S.bets.some(b => b.id === qid)) return fail('이미 걸었습니다.');
  if (!q.opts[k]) return fail('보기를 고르세요.');
  const unit = betKind().unit;
  stake = Math.floor(stake / unit) * unit;
  if (!(stake >= unit)) return fail('걸 금액을 정하세요.');
  if (stake > S.cash) return fail('현금이 부족합니다.');
  const odds = betOdds(q, k, stake);
  S.cash -= stake; S.bets.push({ id: qid, k, stake, odds });
  log(`${q.title} · ${q.opts[k][0]}에 ${fmtWon(stake)} (배당 ${odds}배)`, 'blue');
  return ok(odds);
}
function settleBets() {
  const ym = curYM();
  for (const q of SPORTS.filter(x => x.end === ym)) {
    const b = S.bets.find(x => x.id === q.id);
    if (!b) { log('📣 ' + q.res, ''); continue; }
    const pay = b.k === q.win ? Math.round(b.stake * (b.odds || q.opts[b.k][1])) : 0;
    S.cash += pay; b.pay = pay;
    log(`${q.title} · ${pay ? '맞혔습니다 +' + fmtWon(pay) : '틀렸습니다 -' + fmtWon(b.stake)}`, pay ? 'good' : 'bad');
    enqueue('sportres:' + q.id);
  }
  S.betsDone = (S.betsDone || []).concat(S.bets.filter(b => SPORT[b.id].end === ym)).slice(-20);
  S.bets = S.bets.filter(b => SPORT[b.id].end !== ym);
}

function fmtWon(n, full) {
  if (n == null || !isFinite(n)) return '-';
  const s = n < 0 ? '-' : '', a = Math.abs(n);
  if (full) return s + Math.round(a).toLocaleString('ko-KR') + '원';
  const t = (x, d) => (+x.toFixed(d)).toLocaleString('ko-KR', { maximumFractionDigits: d });
  if (a < 1e4) return s + Math.round(a).toLocaleString('ko-KR') + '원';
  if (a < 1e8) return s + t(a / 1e4, a < 1e5 ? 1 : 0) + '만';
  if (a < 1e12) return s + t(a / 1e8, a < 1e10 ? 2 : 1) + '억';
  if (a < 1e16) return s + t(a / 1e12, a < 1e14 ? 2 : 0) + '조';
  return s + t(a / 1e16, 2) + '경';
}

function condOk(c, cid) {

  const ym = curYM();

  if (c.age != null && age() < c.age) return false;
  if (c.ym && ym < c.ym) return false;
  if (c.to && ym > c.to) return false;

function checkEvents() {
  if (S.ended && !S.queue.includes('finale')) return;

  for (const [id, e] of Object.entries(STORY)) {
    if (e.cond) { if (e.cond()) enqueue('story:' + id); continue; }
    if (e.at !== ym) continue;
    if (e.when && !e.when()) continue;
    enqueue('story:' + id);
  }
  HISTORY.forEach((h, i) => { if (h.ym === ym) enqueue('news:' + i); });
  if (stat('fame') >= SPONSOR_FAME && year() >= SNS_INCOME_FROM && month() === 6) enqueue('sponsor:' + year());
  for (const q of SPORTS) if (q.ask === ym) enqueue('sport:' + q.id);

      const key = 'char:' + c.id + ':' + e.id;

    }

function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.max(0, Math.min(255, Math.round(v * f))));
  return '#' + c.map(v => v.toString(16).padStart(2, '0')).join('');
}

  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const n = vals.length - 1 || 1;
  const X = i => P.l + (W - P.l - P.r) * i / n, Y = v => P.t + (H - P.t - P.b) * (1 - (f(v) - lo) / (hi - lo));
  const sp = opts.split == null ? Infinity : opts.split;
  const past = pts.filter(p => p[0] <= sp), fut = pts.filter(p => p[0] >= sp);
  const path = a => a.map((p, k) => (k ? 'L' : 'M') + X(p[0]).toFixed(1) + ' ' + Y(p[1]).toFixed(1)).join('');
  const area = past.length > 1 ? path(past) + `L${X(past[past.length - 1][0]).toFixed(1)} ${H - P.b}L${X(past[0][0]).toFixed(1)} ${H - P.b}Z` : '';
  const up = past.length > 1 && past[past.length - 1][1] >= past[0][1];
  const col = opts.color || (up ? 'var(--up)' : 'var(--down)');
  const inv = v => log ? Math.exp(v) : v;
  const fmt = opts.fmt || (v => (+v.toPrecision(3)).toLocaleString('ko-KR'));
  const lab = (opts.labels || []).map(([i, t]) => `<text x="${X(i).toFixed(1)}" y="${H - 4}" class="ax" text-anchor="middle">${t}</text>`).join('');
  const last = past[past.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || '차트'}">
    <path d="M${P.l} ${P.t}H${W - P.r}M${P.l} ${(P.t + H - P.b) / 2}H${W - P.r}M${P.l} ${H - P.b}H${W - P.r}" class="grid"/>
    <text x="${W - P.r + 4}" y="${P.t + 4}" class="ax">${fmt(inv(hi))}</text><text x="${W - P.r + 4}" y="${H - P.b + 4}" class="ax">${fmt(inv(lo))}</text>
    ${area ? `<path d="${area}" fill="${col}" opacity=".12"/>` : ''}
    <path d="${path(past)}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke"/>
    ${fut.length > 1 ? `<path d="${path(fut)}" fill="none" stroke="var(--gem)" stroke-width="2" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/>` : ''}
    ${last ? `<circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="${col}"/>` : ''}
    ${lab}</svg>`;
}

// 관계도: 주인공을 가운데 두고 인물을 둘레에 놓는다. 가운데로 향하는 선은 나와의 관계(굵기 = 호감, 관계 이름은 인물 아래),
// 둘레의 점선은 인물끼리의 관계
// 서로 관계가 있는 사람끼리 이웃하게 놓는다 (점선이 가운데를 가로지르지 않게)
const MAP_ORDER = ['broker', 'mom', 'dad', 'sis', 'haeun', 'seoyun', 'taeho', 'teacher', 'chaerin', 'suyeon', 'gaeun', 'doyun', 'minji', 'hyunwoo', 'jisu'];
const KIND_COLOR = { family: '#d9962b', friend: '#3b7be0', romance: '#e0527e', mentor: '#1f9d55', rival: '#d64545' };
function relMapHTML() {
  const ids = [...MAP_ORDER.filter(id => S.people[id] && S.people[id].met), ...metList().map(c => c.id).filter(id => !MAP_ORDER.includes(id))];
  const n = ids.length, W = 360, H = n > 13 ? 470 : 420, cx = 180, cy = H / 2, sy = n > 13 ? 1.24 : 1.12;
  const R = n <= 4 ? 110 : n <= 8 ? 138 : 152;
  const pos = {};
  ids.forEach((id, i) => { const ang = -Math.PI / 2 + 2 * Math.PI * i / n; pos[id] = [cx + R * Math.cos(ang), cy + R * sy * Math.sin(ang)]; });
  const col = id => S.people[id].lover || S.people[id].spouse ? KIND_COLOR.romance : KIND_COLOR[CH[id].kind];
  // 점선 이름표는 인물 칸(얼굴·이름·관계)과 다른 이름표를 피해 빈자리를 찾아 놓는다
  const boxes = ids.map(id => { const [x, y] = pos[id]; return [x - 34, y - 38, x + 34, y + 38]; }).concat([[cx - 42, cy - 48, cx + 42, cy + 48]]);
  const hit = b => b[0] < 2 || b[2] > W - 2 || b[1] < 2 || b[3] > H - 2 || boxes.some(o => b[0] < o[2] && b[2] > o[0] && b[1] < o[3] && b[3] > o[1]);
  function spot(x0, y0, dx, dy, w) {
    for (const s of [0, 12, -12, 24, -24, 36, -36, 48, -48, 60]) for (const v of [0, 14, -14, 28, -28]) {
      const x = x0 + dx * s - dy * v, y = y0 + dy * s + dx * v, b = [x - w / 2, y - 10, x + w / 2, y + 3];
      if (!hit(b)) { boxes.push(b); return [x, y]; }
    }
    return [x0, y0];
  }
  const links = REL_LINKS.filter(l => pos[l.a] && pos[l.b] && (!l.when || l.when())).map(l => {
    const [x1, y1] = pos[l.a], [x2, y2] = pos[l.b], mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    // 가운데 반대쪽으로 휘게 한다. 마주 보는 두 사람이면 가운데를 피해 옆으로 크게 돌린다
    const far = Math.hypot(mx - cx, my - cy) < 20, len = Math.hypot(x2 - x1, y2 - y1) || 1;
    const qx = far ? mx - (y2 - y1) / len * R * 1.3 : mx + (mx - cx) * 0.5, qy = far ? my + (x2 - x1) / len * R * 1.3 : my + (my - cy) * 0.5;
    const px = 0.25 * x1 + 0.5 * qx + 0.25 * x2, py = 0.25 * y1 + 0.5 * qy + 0.25 * y2, d = Math.hypot(px - cx, py - cy) || 1;
    const [lx, ly] = spot(px, py, (px - cx) / d, (py - cy) / d, l.t.length * 9.5 + 6);
    return `<path d="M${x1.toFixed(1)} ${y1.toFixed(1)} Q${qx.toFixed(1)} ${qy.toFixed(1)} ${x2.toFixed(1)} ${y2.toFixed(1)}" fill="none" stroke="${l.bad ? 'var(--bad)' : 'var(--muted)'}" stroke-width="1.3" stroke-dasharray="${l.bad ? '5 3' : '2 3'}" opacity=".85"/>
      <text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" class="map-link ${l.bad ? 'bad' : ''}">${l.t}</text>`;
  }).join('');
  const spokes = ids.map(id => {
    const [x, y] = pos[id], w = Math.max(1.2, S.people[id].aff / 22);
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${col(id)}" stroke-width="${w.toFixed(1)}" stroke-linecap="round" opacity=".5"/>`;
  }).join('');
  const nodes = ids.map(id => { const [x, y] = pos[id];
    return `<button class="map-node" style="left:${(x / W * 100).toFixed(2)}%;top:${(y / H * 100).toFixed(2)}%;--c:${col(id)}" data-act="person" data-arg="${id}">
      <span class="face">${portraitHTML(id)}</span><b>${CH[id].name}</b><span class="rel-chip">${relLabel(id)}</span></button>`; }).join('');
  const me = `<div class="map-me" style="left:50%;top:${(cy / H * 100).toFixed(2)}%"><span class="face">${playerFace()}</span><b>${esc(S.name)}</b><small>${age()}살 · 나</small></div>`;
  const legend = [['family', '가족'], ['friend', '친구'], ['romance', '연애'], ['mentor', '어른'], ['rival', '경계']].map(([k, l]) => `<span><i style="background:${KIND_COLOR[k]}"></i>${l}</span>`).join('');
  return `<div class="card"><h3>관계도 <span class="r">${n}명</span></h3>
    <div class="relmap" style="aspect-ratio:${W}/${H}"><svg class="relmap-svg" viewBox="0 0 ${W} ${H}" aria-hidden="true">${links}${spokes}</svg>${nodes}${me}</div>
    <div class="map-legend">${legend}<span>선 굵기 = 호감</span><span>점선 = 서로의 관계</span><span class="bad">빨간 점선 = 악연</span></div></div>`;
}

function yearLabels(mis) {
  const n = mis.length; if (!n) return [];
  const yrs = (mis[n - 1] - mis[0]) / 12, step = yrs > 16 ? 5 : yrs > 6 ? 2 : 1;
  const out = [];
  mis.forEach((mi, i) => { const ym = ymOf(mi); if (ym.endsWith('-01') && (+ym.slice(0, 4)) % step === 0) out.push([i, "'" + ym.slice(2, 4)]); });
  return out;
}

let typeTimer = null;
function typewriter() {
  const x = RUN && RUN.cur && !RUN.cur.c ? storyLine() : null;
  if (!x || !S.textSpeed || typeof setInterval !== 'function') { clearInterval(typeTimer); return; }
  if (UI.typedKey === x.key) return;
  UI.typedKey = x.key; UI.typed = 0;
  clearInterval(typeTimer);
  const el = document.querySelector('.story-text'); if (el) el.textContent = '';
  typeTimer = setInterval(() => {
    // 그사이 다음 대사로 넘어갔으면 멈춘다 (지난 대사가 새 대사를 덮어쓰지 않게)
    const now = RUN && RUN.cur && storyLine();
    if (!now || now.key !== x.key) { clearInterval(typeTimer); return; }
    UI.typed += 2;
    const e = document.querySelector('.story-text');
    if (e) e.textContent = x.text.slice(0, UI.typed);
    if (UI.typed >= x.text.length) clearInterval(typeTimer);
  }, 24);
}

const ACT = {

  ftab(t) { const tb = TABS.find(x => x.id === t); UI.ftab = t; UI.sel = null; if (!tabOpen(t)) toast(`${tb.label}은 ${tb.open.replace('-', '년 ')}월에 열립니다.`); render(); },
  sel(id) { UI.sel = id; UI.qty = 0; UI.side = 'buy'; render(); },
  side(s) { UI.side = s; UI.qty = 0; render(); },

  trade(id) { const r = UI.side === 'sell' ? sell(id, UI.qty) : buy(id, UI.qty); if (r.ok) UI.qty = 0; sold(r); },

  slot(s) { UI.slot = s; UI.sheet = 'slot'; render(); },
  equip(a) { const [s, id] = a.split(':'); if (equip(s, id).ok) { save(); UI.sheet = null; } render(); },
  unequip(s) { unequip(s); save(); render(); },
  openTicker(id) { const t = TK[id]; UI.sheet = 'stocks'; UI.ftab = t.tab === 'COIN' || t.tab === 'ETF' || t.tab === 'US' ? t.tab : tkTab(id); ACT.sel(id); },

  borrow() { borrow(UI.amt); save(); render(); },
  repay() { repay(UI.amt); save(); render(); },
  estBuy(id) { const isNew = !S.re[id]; if (buyEstate(id).ok) { save(); if (isNew) toast('샀습니다. 부동산 관리에서 들어가 살거나 세를 놓으세요.'); } render(); },
  estSell(id) { sold(sellEstate(id)); },
  lease(arg) { const [id, m] = arg.split(':'); if (setLease(id, m).ok) save(); render(); },
  live(id) { if (moveIn(id).ok) save(); render(); },
  leave() { if (moveOut().ok) save(); render(); },
  estMgrBack() { UI.sheet = 'estate'; render(); },
  luxBuy(id) { if (buyLux(id).ok) save(); render(); },
  luxSell(id) { sold(sellLux(id)); },
  popClose() { UI.pops.shift(); afterTurn(); },
  popScrim(_, el, ev) { if (ev && ev.target === el) ACT.popClose(); },
  report(a) { const [m0, m1, k] = a.split(':'); const r = periodReport(+m0, +m1, k); if (r) UI.pops.push(r); render(); },
  finP(k) { UI.finP = k; render(); },
  shopBuy(id) { if (buyShop(id).ok) { toast(ITEM[id].name + '을(를) 샀습니다.'); save(); } render(); },
  person(id) { UI.sheet = 'person'; UI.sel = id; UI.giftOpen = false; render(); },
  talk(id) { const r = talk(id); if (r.ok) UI.say[id] = r.v; afterTurn(); },
  outing(id) { const r = outing(id); if (r.ok) { UI.sheet = null; UI.bubble = `${CH[id].name}와 즐거운 시간을 보냈습니다.`; } afterTurn(); },
  giftOpen() { UI.giftOpen = !UI.giftOpen; render(); },
  gift(a) { const [id, k] = a.split(':'); if (giveGift(id, k).ok) { UI.giftOpen = false; UI.say[id] = CH[id].likes.includes(k) ? '어? 이거 내가 좋아하는 건데! 고마워.' : '고마워. 잘 쓸게.'; save(); } afterTurn(); },
  money(id) { if (giveMoney(id).ok) { UI.say[id] = '뭘 이런 걸 다… 고맙다.'; save(); } render(); },
  confess(id) { const r = confess(id); if (r.ok && !r.v) UI.say[id] = '…미안. 아직은 잘 모르겠어.'; UI.sheet = r.v ? null : UI.sheet; save(); afterTurn(); },
  propose(id) { if (propose(id).ok) UI.sheet = null; save(); afterTurn(); },
  remember(id) { remember(id); save(); render(); },
  do(kind) {
    if (kind === 'shop') return ACT.sheet('shop');
    const r = doAction(kind); if (r.ok) UI.bubble = r.v; afterTurn();
  },
  recall() { UI.recall = null; UI.sheet = 'recall'; render(); },
  recallH(h) { const r = recall(+h); if (r.ok) { UI.recall = r.v; save(); } render(); },
  recallBack() { UI.recall = null; render(); },
  lottoPick(n) { n = +n; const p = UI.lottoPick, i = p.indexOf(n); if (i >= 0) p.splice(i, 1); else if (p.length < 6) p.push(n); else toast('6개까지 고를 수 있습니다.'); p.sort((a, b) => a - b); render(); },
  lottoAuto() { UI.lottoPick = lottoAuto(); render(); },
  lottoFill() { const L = S.lotto; if (!L) return; const p = L.seq.slice(0, L.open); for (const n of lottoAuto()) if (p.length < 6 && !p.includes(n)) p.push(n); UI.lottoPick = p.sort((a, b) => a - b); render(); },
  lottoClear() { UI.lottoPick = []; render(); },
  lottoBuy() { if (buyLotto(UI.lottoPick).ok) { UI.lottoPick = []; save(); } render(); },
  lottoReveal() { if (lottoReveal().ok) save(); render(); },
  // 다음 달: 아직 할 수 있는 행동이 남았으면 한 번 더 눌러야 넘어간다
  next() {
    if (S.ended || RUN) return;
    const canAct = ['study', 'gym', 'work'].some(k => !actionBlocked(k));
    if (canAct && !UI.confirmNext) { UI.confirmNext = true; toast(`체력이 ${Math.round(S.sta)} 남았습니다. 한 번 더 누르면 다음 달로 넘어갑니다.`); return render(); }
    UI.confirmNext = false;
    const r = nextMonth();
    if (r.ok) { UI.bubble = S.ended ? '마지막 달이 끝났습니다.' : S.hints.length ? '' : `${year()}년 ${month()}월 · 지난달보다 ${fmtSigned(netWorth() - S.monthStartNW)}`; save();
      const rep = !S.ended && periodDue(); if (rep) UI.pops.push(rep); }   // 분기·해가 바뀌면 결산 창
    afterTurn();
  },
  storyTap(_, el, ev) {
    if (!RUN || !RUN.cur || RUN.cur.bet) return;
    const x = storyLine();
    if (!x.L.c && S.textSpeed && UI.typedKey === x.key && UI.typed < x.text.length) { UI.typed = x.text.length; clearInterval(typeTimer); render(); return; }
    if (x.L.c) return;
    storyAdvance(); afterTurn();
  },
  choose(k) { storyChoose(+k); afterTurn(); },
  betPick(k) { if (UI.bet) UI.bet.k = +k; render(); },
  betPct(p) { const q = SPORT[UI.bet && UI.bet.id]; if (!q) return; const { bk, cash } = betState(q); UI.bet.stake = +p >= 1 ? cash : Math.floor(cash * p / bk.unit) * bk.unit; render(); },
  betPlace() {
    const B = UI.bet, q = B && SPORT[B.id]; if (!q) return;
    const r = placeBet(q.id, B.k, B.stake);
    if (!r.ok) return render();
    RUN.lines.splice(RUN.i + 1, 0, { n: `${q.opts[B.k][0]}에 ${fmtWon(S.bets[S.bets.length - 1].stake)}을 걸었습니다. 배당 ${r.v}배, 맞히면 ${fmtWon(Math.round(S.bets[S.bets.length - 1].stake * r.v))}입니다.` });
    UI.bet = null; save(); storyAdvance(); afterTurn();
  },
  betSkip() { UI.bet = null; storyAdvance(); afterTurn(); },
  betRemember() { if (UI.bet && betRemember(UI.bet.id).ok) { UI.bet.k = SPORT[UI.bet.id].win; save(); } render(); },
  theme(t) { S.theme = t; applyTheme(); save(); render(); },
  speed(v) { S.textSpeed = +v; save(); render(); },
  saveNow() { save(); toast('저장했습니다.'); },
  install() { installApp(); },
  newGame() {
    if (!UI.confirmNew && UI.sheet !== 'ending') { UI.confirmNew = true; return render(); }
    UI.confirmNew = false; clearSave(); S = null; RUN = null; UI.sheet = null; UI.tab = 'main'; UI.endShown = false; render();
  },
  start() { UI.sheet = null; UI.tab = 'main'; UI.endShown = false; newGame({ name: (UI.name || DEFAULT_NAME).trim() || DEFAULT_NAME }); applyTheme(); save(); afterTurn(); },
  continue() { if (load()) { applyTheme(); afterTurn(); } else toast('저장된 게임이 없습니다.'); },
};
function onInput(name, value) {
  if (name === 'qty') {   // 막대를 끄는 동안에는 다시 그리지 않고 글자만 바꾼다
    UI.qty = Math.max(0, +value || 0);
    if (UI.sel && TK[UI.sel]) {
      const q = $('qtyLabel'), e = $('estLabel'), b = $('tradeBtn');
      if (q) q.textContent = fmtQty(UI.sel, UI.qty);
      if (e) e.textContent = tradeEst(UI.sel);
      if (b) b.disabled = !(UI.qty > 0);
    }
  } else if (name === 'bet' && UI.bet) {
    const q = SPORT[UI.bet.id], { bk } = betState(q);
    UI.bet.stake = Math.floor((+value || 0) / bk.unit) * bk.unit;
    const s = $('betStake'), n = $('betNote'), b = $('betBtn');
    if (s) s.textContent = fmtWon(UI.bet.stake);
    if (n) n.textContent = betNote(UI.bet.stake);
    q.opts.forEach((_, k) => { const e = $('betOdds' + k); if (e) e.textContent = betOptText(q, k, UI.bet.stake); });
    if (b) b.disabled = !(UI.bet.k != null && UI.bet.stake >= bk.unit);
  } else if (name === 'amt') {
    UI.amt = Math.max(0, +value || 0);
    const e = $('amtLabel'); if (e) e.textContent = fmtWon(UI.amt);
  } else if (name === 'name') UI.name = value;
}
function applyTheme() {
  const t = S && S.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}

// ===== 저장 · 불러오기 · 시작 =====
function save() {
  if (!S) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* 저장 공간이 없으면 조용히 넘어간다 */ }
}
function hasSave() { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } }
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 무시 */ } }
function load() {
  let raw = null;
  try { raw = localStorage.getItem(SAVE_KEY); } catch (e) { return false; }
  if (!raw) return false;
  try {
    const d = JSON.parse(raw);
    if (!d || d.v !== 2 || typeof d.mi !== 'number') return false;   // 주 단위였던 v1 저장은 버린다
    const base = newGame({ name: d.name, seed: 1 });   // 새 항목이 생겨도 기본값을 채운다
    S = Object.assign(base, d);
    for (const r of Object.values(S.re)) {   // 부동산 관리 전 저장: 원래처럼 모두 월세로 둔다
      if (!r.mode) r.mode = 'wolse';
      if (r.dep == null) r.dep = 0;
      if (r.lease == null) r.lease = S.mi;
    }
    RUN = null;
    return true;
  } catch (e) { return false; }
}

// ---- 홈 화면 설치 ----
// 안드로이드 크롬은 설치 창을 바로 띄울 수 있고, 아이폰 사파리는 「공유 → 홈 화면에 추가」로 안내한다
const INSTALL = { evt: null, done: false };
function isStandalone() {
  return (typeof matchMedia === 'function' && matchMedia('(display-mode: standalone)').matches) || (typeof navigator !== 'undefined' && navigator.standalone === true);
}
function installState() {
  if (INSTALL.done || isStandalone()) return 'installed';
  if (INSTALL.evt) return 'prompt';
  const ua = typeof navigator !== 'undefined' ? navigator.userAgent : '';
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return 'ios';
  return 'manual';
}
async function installApp() {
  if (!INSTALL.evt) return;
  INSTALL.evt.prompt();
  const choice = await INSTALL.evt.userChoice;
  INSTALL.evt = null;
  if (choice.outcome === 'accepted') { INSTALL.done = true; toast('홈 화면에 설치했습니다.'); }
  render();
}

// 클릭과 입력은 한곳에서 받는다. data-act 가 붙은 가장 가까운 요소의 동작을 부른다
function bindEvents() {
  document.addEventListener('click', ev => {
    const el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACT[el.dataset.act];
    if (el.dataset.act !== 'next') UI.confirmNext = false;   // 다른 걸 누르면 넘기기 확인을 취소한다
    if (fn) fn(el.dataset.arg, el, ev);
  });
  document.addEventListener('input', ev => {
    const el = ev.target; if (el && el.dataset && el.dataset.input) onInput(el.dataset.input, el.value);
  });
  document.addEventListener('keydown', ev => {
    if (!RUN || !RUN.cur) return;
    if (ev.key === ' ' || ev.key === 'Enter') { ev.preventDefault(); ACT.storyTap(); }
    if (RUN.cur.c && /^[1-9]$/.test(ev.key)) ACT.choose(+ev.key - 1);
  });
}

if (typeof window !== 'undefined' && !window.__TEST__) {
  bindEvents();
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); INSTALL.evt = e; if (UI.sheet === 'settings') render(); });
  window.addEventListener('appinstalled', () => { INSTALL.done = true; INSTALL.evt = null; toast('홈 화면에 설치했습니다.'); });
  // 서비스 워커는 https 나 localhost 에서만 돈다 (GitHub Pages 는 https)
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
  render();
}

</script>
